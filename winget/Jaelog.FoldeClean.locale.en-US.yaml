ShortDescription: Safe folder cleanup that detects files linked to programs or the system and organizes the rest with proven systems.
Description: |-
  FoldeClean organizes folders safely. It first finds shortcut targets, registry-registered programs, files in use and project folders and protects them,
  then moves the remaining files using one of seven methods: by type, by date, type then year, PARA, Johnny.Decimal, archive old files, or duplicate cleanup.
  Preview the move paths as a flow diagram before running; every move is journaled and can be undone in one click. Korean, English, Chinese and Japanese UI.
